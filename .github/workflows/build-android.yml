name: בניית אפליקציית אנדרואיד (APK)

# הרצה ידנית בלבד: לשונית Actions ← "בניית אפליקציית אנדרואיד (APK)" ← Run workflow.
# התוצאה: קובץ APK חתום שמופיע בעמוד Releases של ה-Repository, וגם כקובץ מצורף להרצה.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: הורדת הקוד
        uses: actions/checkout@v4

      - name: התקנת Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: התקנת Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: הכנת Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: בדיקה שכל הסודות הוגדרו
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -z "$API_KEY" ] && missing="$missing VITE_FIREBASE_API_KEY"
          [ -z "$PROJECT_ID" ] && missing="$missing VITE_FIREBASE_PROJECT_ID"
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::חסרים סודות ב-GitHub:$missing. Settings ← Secrets and variables ← Actions. ההוראות ב-docs/ANDROID.md"
            exit 1
          fi

      - name: התקנת חבילות
        run: npm ci

      - name: בדיקות (TypeScript, ESLint, בדיקות יחידה)
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: בניית האפליקציה (Web)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_PRIVACY_CONTACT_EMAIL: ${{ secrets.VITE_PRIVACY_CONTACT_EMAIL }}

      - name: העתקת האתר לפרויקט האנדרואיד
        run: npx cap sync android

      - name: הכנת מפתח החתימה
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: בניית APK חתום
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: familyfinance
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: שינוי שם הקובץ ואימות חתימה
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "family-finance-${APP_VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "family-finance-${APP_VERSION_NAME}.apk"

      - name: שמירה כקובץ מצורף להרצה
        uses: actions/upload-artifact@v4
        with:
          name: family-finance-apk
          path: family-finance-*.apk
          retention-days: 30

      - name: פרסום בעמוד Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${APP_VERSION_NAME}" "family-finance-${APP_VERSION_NAME}.apk" \
            --title "אפליקציית אנדרואיד ${APP_VERSION_NAME}" \
            --notes "קובץ התקנה (APK) לאנדרואיד. להורדה מהטלפון ולהתקנה לפי ההוראות ב-docs/ANDROID.md."
