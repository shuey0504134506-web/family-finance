name: פריסה לדומיין של Firebase (web.app)

# רצה ידנית בלבד: לשונית Actions ← שם ה-workflow ← Run workflow.
# משתמשת באותם סודות של פריסת הפונקציות (FIREBASE_SERVICE_ACCOUNT) ובסודות Firebase של האתר.
# לחשבון השירות נדרש התפקיד "Firebase Hosting Admin".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: התקנת חבילות
        run: npm ci

      - name: בניית האפליקציה
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: כתיבת מפתח השירות לקובץ זמני
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "חסר הסוד FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"

      - name: פריסה
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: מחיקת המפתח הזמני
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
