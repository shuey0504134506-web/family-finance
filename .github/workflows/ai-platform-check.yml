name: AI platform verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [ai-platform-v2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check functions/index.js
      - run: node --test functions/ai/providers.test.cjs
      - run: node --test functions/ai/local-analysis.test.mjs
      - run: node --test functions/ai/routing.test.cjs
      - run: node --test functions/ai/chat-title.test.cjs
      - run: node --test functions/ai/action-drafts.test.cjs
      - name: Package isolated fictitious demo (never deploy production)
        run: |
          mkdir -p demo-dist
          cp demo/index.html demo/demo.css demo/demo.mjs demo-dist/
          cp functions/ai/local-analysis.mjs src/assets/mountains-wide.jpg demo-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-family-finance-demo
          path: demo-dist
